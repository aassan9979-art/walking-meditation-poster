<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F3E8">
<title>걷기명상 참가 신청</title>
<meta name="description" content="생명을 살리는 걷기명상 참가 신청 — 2026년 9월 27일(일), 서귀포시 회수동 WE호텔. 오전 9시부터 오후 1시까지 매시 정각 출발. 참가비 없음.">
<link rel="canonical" href="https://aassan9979-art.github.io/walking-meditation-poster/apply/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aassan9979-art.github.io/walking-meditation-poster/apply/">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="걷기명상 참가 신청">
<meta property="og:description" content="2026년 9월 27일(일) 오전 9시 · 10시 · 11시 · 낮 12시 · 오후 1시 출발 · 서귀포시 회수동 WE호텔 · 참가비 없음">
<meta property="og:image" content="https://aassan9979-art.github.io/walking-meditation-poster/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="걷기명상 참가 신청">
<meta name="twitter:image" content="https://aassan9979-art.github.io/walking-meditation-poster/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
  :root{
    --paper:#F5F3E8;
    --paper-lift:#FBFAF2;
    --ink:#26402E;
    --ink-soft:#5E6B52;
    --jade:#8A6524;
    --leaf:#C79A3E;
    --rule:#DAD5C0;
    --warn:#96391B;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif;
    word-break:keep-all;overflow-wrap:break-word;
  }
  a{color:var(--jade);}
  a:hover{color:var(--ink);}
  :focus-visible{outline:2px solid var(--jade);outline-offset:3px;}

  .topbar{height:8px;background:var(--leaf);}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}

  header{padding-block:44px 0;}
  .eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--jade);}
  h1{
    font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif;font-weight:900;
    font-size:56px;line-height:1.1;letter-spacing:-.02em;margin:16px 0 0;color:var(--ink);
  }
  .tick{width:64px;height:4px;background:var(--leaf);margin-top:16px;}
  /* 날짜와 장소를 한 줄로만. 나머지 안내는 포스터에 있다. */
  .when{
    margin:20px 0 0;font-size:17px;line-height:1.7;color:var(--ink-soft);
    font-weight:300;font-variant-numeric:tabular-nums;
  }
  .when b{color:var(--ink);font-weight:600;}

  form{margin:24px 0 0;}
  .q{
    border:0;margin:0 0 26px;padding:0;
  }
  .q > legend, .q > .label{
    padding:0;font-size:17px;font-weight:600;line-height:1.5;color:var(--ink);
    display:block;margin-bottom:4px;
  }
  .hint{font-size:14px;color:var(--ink-soft);font-weight:300;line-height:1.5;margin:0 0 10px;}
  .req{color:var(--jade);font-weight:600;margin-left:4px;}

  .choice{
    display:flex;align-items:flex-start;gap:10px;
    padding:13px 14px;margin-top:8px;
    background:var(--paper-lift);border:1px solid var(--rule);
    font-size:16px;line-height:1.5;cursor:pointer;
  }
  .choice:has(input:checked){border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade);}
  .choice input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--jade);flex:0 0 auto;}

  input[type="text"], input[type="tel"], input[type="number"], textarea{
    width:100%;font:inherit;font-size:17px;color:var(--ink);
    background:var(--paper-lift);border:1px solid var(--rule);
    padding:13px 14px;border-radius:0;
  }
  input:focus, textarea:focus{border-color:var(--jade);outline:none;box-shadow:inset 0 0 0 1px var(--jade);}
  textarea{min-height:104px;resize:vertical;line-height:1.6;}
  input[type="number"]{max-width:160px;}

  .timegrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .timegrid .choice{margin-top:0;flex:1 1 150px;}

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}

  .submit{
    display:inline-block;border:0;cursor:pointer;
    background:var(--jade);color:#fff;
    font:inherit;font-size:18px;font-weight:600;letter-spacing:.02em;
    padding:16px 44px;border-radius:2px;
    box-shadow:0 1px 3px rgba(38,64,46,.3);
  }
  .submit:hover{background:var(--ink);}
  .submit:disabled{opacity:.55;cursor:default;}

  .status{margin:16px 0 0;font-size:15px;line-height:1.7;font-weight:400;}
  .status:empty{margin:0;}
  .status.bad{color:var(--warn);}

  .done{
    margin:24px 0 0;padding:28px 26px;
    background:var(--paper-lift);border:1px solid var(--jade);
  }
  .done h3{
    font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif;font-weight:700;
    font-size:24px;margin:0;color:var(--ink);line-height:1.4;
  }
  .done p{margin:12px 0 0;font-size:16px;line-height:1.7;color:var(--ink-soft);font-weight:300;}

  .privacy{margin:26px 0 0;font-size:14px;line-height:1.7;color:var(--ink-soft);font-weight:300;}
  .fallback{margin:14px 0 0;font-size:15px;line-height:1.7;color:var(--ink-soft);font-weight:300;}
  .fallback b{color:var(--ink);font-weight:600;}
  .back{margin:34px 0 48px;font-size:15px;}


  @media (max-width:640px){
    .wrap{padding:0 18px;}
    header{padding-block:30px 0;}
    h1{font-size:38px;}
    .when{font-size:16px;margin-top:16px;}
    .q > legend, .q > .label{font-size:16px;}
    .submit{width:100%;padding:17px 20px;}
  }

  /* 휴대폰에서만 살아나는 줄바꿈. 넓은 화면에서는 없는 셈이 된다. */
  .br-mo{display:none;}

  @media (max-width:480px){
    .br-mo{display:inline;}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<div class="topbar"></div>

<div class="wrap">
  <header>
    <p class="eyebrow">생명을 살리는 걷기명상</p>
    <h1>참가 신청</h1>
    <div class="tick"></div>
    <p class="when"><b>2026년 9월 27일 (일)</b> · 서귀포시 회수동 WE호텔</p>
  </header>

  <div id="host"></div>

  <p class="back"><a href="../">← 오시는 길과 걷는 순서는 안내 포스터에서</a></p>
</div>

<div class="topbar"></div>

<template id="tpl-form">
  <form id="apply" novalidate>
    <fieldset class="q">
      <legend>1. 참석할 수 있으신가요?<span class="req">*</span></legend>
      <label class="choice">
        <input type="radio" name="attend" id="attend-yes" value="참석합니다." required>
        <span>참석합니다.<span class="hint" style="display:block;margin:2px 0 0">(참석하시는 분만 아래를 마저 적어 주세요.)</span></span>
      </label>
      <label class="choice">
        <input type="radio" name="attend" id="attend-no" value="참석하지 않습니다.">
        <span>참석하지 않습니다.</span>
      </label>
    </fieldset>

    <div id="only-if-attending" hidden>
      <fieldset class="q">
        <legend>2. 몇 시에 오시겠습니까?<span class="req">*</span></legend>
        <p class="hint">매시 정각에 출발해 한 시간 걷습니다. <br class="br-mo">편한 시간을 골라 주세요.</p>
        <div class="timegrid">
          <label class="choice"><input type="radio" name="time" value="오전 9시"><span>오전 9시</span></label>
          <label class="choice"><input type="radio" name="time" value="오전 10시"><span>오전 10시</span></label>
          <label class="choice"><input type="radio" name="time" value="오전 11시"><span>오전 11시</span></label>
          <label class="choice"><input type="radio" name="time" value="낮 12시"><span>낮 12시</span></label>
          <label class="choice"><input type="radio" name="time" value="오후 1시"><span>오후 1시</span></label>
        </div>
      </fieldset>

      <div class="q">
        <label class="label" for="count">3. 몇 명이 참석할 예정인가요?<span class="req">*</span></label>
        <p class="hint">본인을 포함한 인원입니다.</p>
        <input type="number" id="count" name="count" min="1" max="99" inputmode="numeric" placeholder="예: 4">
      </div>

      <div class="q">
        <label class="label" for="people">4. 참석하시는 분 이름, 성별, 나이를 <br class="br-mo">모두 적어주세요.</label>
        <p class="hint">예 — 홍길동, 남, 65세</p>
        <textarea id="people" name="people" rows="4" placeholder="한 분씩 줄을 바꿔 적어 주세요."></textarea>
      </div>

      <div class="q">
        <label class="label" for="phone">5. 안내해드릴 핸드폰 연락처를 남겨주세요.<span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000">
      </div>
    </div>

    <div class="hp" aria-hidden="true">
      <label for="website">이 칸은 비워 두세요</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="submit" id="send">신청하기</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <p class="privacy">적어주신 내용은 이번 걷기명상 안내에만 사용합니다.</p>
    <p class="fallback">인터넷 신청이 어려우시면<br><b>고경봉 010-2699-3001</b> 또는<br><b>최혜광 010-2575-8810</b>으로<br>전화 주시면 됩니다.</p>
  </form>
</template>

<script>
(function () {
  // 신청 내용을 받아 비공개 저장소에 기록하는 Cloudflare Worker
  var ENDPOINT = "https://walking-meditation-apply.aassan9979-194.workers.dev";

  var host = document.getElementById("host");

  host.appendChild(document.getElementById("tpl-form").content.cloneNode(true));

  var form = document.getElementById("apply");
  var only = document.getElementById("only-if-attending");
  var yes = document.getElementById("attend-yes");
  var no = document.getElementById("attend-no");
  var phone = document.getElementById("phone");
  var send = document.getElementById("send");
  var status = document.getElementById("status");

  function toggle() {
    only.hidden = !yes.checked;
  }
  yes.addEventListener("change", toggle);
  no.addEventListener("change", toggle);

  function fail(message) {
    status.className = "status bad";
    status.textContent = message;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    status.className = "status";
    status.textContent = "";

    if (!yes.checked && !no.checked) {
      fail("참석 여부를 골라 주세요.");
      return;
    }
    var countField = document.getElementById("count");
    var picked = form.querySelector('input[name="time"]:checked');
    if (yes.checked) {
      if (!picked) {
        fail("몇 시에 오실지 골라 주세요.");
        form.querySelector('input[name="time"]').focus();
        return;
      }
      var n = parseInt(countField.value, 10);
      if (!(n >= 1)) {
        fail("몇 분이 오시는지 적어 주세요. 본인만 오시면 1을 적으시면 됩니다.");
        countField.focus();
        return;
      }
      if (!phone.value.trim()) {
        fail("연락처를 적어 주세요. 안내를 드리는 데 필요합니다.");
        phone.focus();
        return;
      }
    }

    // 고른 시각을 참석여부에 함께 담아 보냅니다. 이렇게 하면 받는 쪽을 고치지 않아도
    // 명단에 몇 시 회차인지가 남습니다.
    var data = {
      attend: yes.checked ? (yes.value + " · " + picked.value) : no.value,
      count: yes.checked ? document.getElementById("count").value : "",
      people: yes.checked ? document.getElementById("people").value : "",
      phone: yes.checked ? phone.value : "",
      website: document.getElementById("website").value
    };

    send.disabled = true;
    send.textContent = "보내는 중…";

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    })
      .then(function (res) {
        return res.json().catch(function () { return { ok: false }; });
      })
      .then(function (result) {
        if (result && result.ok) {
          done(yes.checked, picked);
          return;
        }
        throw new Error("rejected");
      })
      ['catch'](function () {
        send.disabled = false;
        send.textContent = "신청하기";
        fail("지금은 접수가 되지 않습니다. 잠시 뒤 다시 해보시거나, 고경봉 010-2699-3001 또는 최혜광 010-2575-8810으로 전화 주세요.");
      });
  });

  function done(attending, picked) {
    var box = document.createElement("div");
    box.className = "done";
    var h = document.createElement("h3");
    var p = document.createElement("p");
    if (attending) {
      h.textContent = "신청이 접수되었습니다.";
      p.textContent =
        "9월 27일 일요일 " + (picked ? picked.value : "") + ", 서귀포 회수동 WE호텔에서 뵙겠습니다. 출발 10분 전까지 호텔 입구 또는 메가와티공원 입구에서 접수해 주세요.";
    } else {
      h.textContent = "알려주셔서 고맙습니다.";
      p.textContent = "다음 걷기명상에서 뵙기를 바랍니다.";
    }
    box.appendChild(h);
    box.appendChild(p);
    host.replaceChildren(box);
    box.scrollIntoView({ block: "center" });
  }

})();
</script>

</body>
</html>
